name: Contract checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "schema/**"
      - "policy/**"
      - "docs/**"
      - ".github/workflows/**"
      - "data/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests jsonschema

      - name: Legacy generator tests
        run: |
          python scripts/test_konoha_build.py
          python scripts/test_recs_build.py

      - name: Release contract tests
        run: |
          python scripts/test_release.py
          python scripts/test_health.py
          python scripts/test_compat.py

      - name: Dataset invariants
        run: python scripts/audit_dataset.py --strict --json > /dev/null

      # Freshness is enforced by the refresh workflow, which is the job allowed to
      # change the tree. CI only proves the committed tree is internally consistent.
      - name: Publication health
        run: python scripts/publish_health.py --max-age-hours 876000 --allow-blocked

      - name: Build and verify a staging release
        run: |
          python scripts/build_release.py \
            --out build/ci \
            --limit 250 \
            --publish \
            --allow-unverified-sources
          python scripts/validate_release.py --root build/ci --schemas
          python scripts/rollback_release.py --root build/ci --list

      - name: Verify the committed consumer fixtures
        run: python scripts/validate_release.py --root fixtures/v1 --schemas
